name: Deploy Glue CI/CD

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy and Run ETL Pipeline
    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_script_bucket_name: ${{ vars.S3_BUCKET_NAME }}
      TF_VAR_glue_job_silver_name: ${{ vars.GLUE_JOB_SILVER }}
      TF_VAR_glue_job_gold_name: ${{ vars.GLUE_JOB_GOLD }}
      TF_VAR_glue_crawler_name: ${{ vars.GLUE_CRAWLER }}
      TF_VAR_glue_database_name: ${{ vars.DATABASE_GLUE }}
      TF_VAR_glue_role_name: ${{ vars.GLUE_ROLE_NAME }}

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Upload ETL Scripts to S3
      - name: Upload ETL Scripts to S3
        run: |
          echo "Uploading ETL Scripts to S3 Bucket: ${{ vars.S3_BUCKET_NAME }}..."
          aws s3 cp etl/final_silver_etl.py s3://${{ vars.S3_BUCKET_NAME }}/etl/final_silver_etl.py
          aws s3 cp etl/gold_etl.py s3://${{ vars.S3_BUCKET_NAME }}/etl/gold_etl.py

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.5.7' }}

      # 5. Terraform Format
      - name: Terraform Format
        run: terraform fmt -check
        working-directory: terraform

      # 6. Terraform Init
      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      # 7. Import Existing AWS Resources
      - name: Import Existing AWS Resources
        run: bash import_existing.sh
        working-directory: terraform

      # 8. Terraform Validate
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      # 9. Terraform Plan
      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform

      # 10. Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform

      # 10. Start Glue Job Bronze→Silver
      # 11. Wait until Success
      - name: Start Glue Job Bronze→Silver and Wait
        run: |
          # Helper function to run AWS CLI commands with retry and credential expiration handling
          run_aws_cli() {
            local cmd="$1"
            local attempt=1
            local max_attempts=3
            local output
            local exit_code
            
            while [ $attempt -le $max_attempts ]; do
              local err_file=$(mktemp)
              output=$(eval "$cmd" 2>"$err_file")
              exit_code=$?
              local err_msg=$(cat "$err_file")
              rm -f "$err_file"
              
              if [ $exit_code -eq 0 ]; then
                echo "$output"
                return 0
              fi
              
              if echo "$err_msg" | grep -Eiq "AccessDenied|ExpiredToken|voc-cancel-cred"; then
                echo "Federated AWS credentials expired. Update GitHub Secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN) and rerun the workflow."
                exit 1
              fi
              
              echo "Warning: AWS CLI call failed (Attempt $attempt/$max_attempts). Error: $err_msg" >&2
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                sleep 5
              fi
            done
            
            echo "Error: AWS CLI call failed after $max_attempts attempts." >&2
            exit 1
          }

          echo "Starting Glue Job Bronze->Silver: ${{ vars.GLUE_JOB_SILVER }}..."
          RUN_ID=$(run_aws_cli "aws glue start-job-run --job-name '${{ vars.GLUE_JOB_SILVER }}' --query 'JobRunId' --output text")
          echo "Job Run ID: $RUN_ID"
          
          echo "Polling Silver Job status..."
          while true; do
            STATUS=$(run_aws_cli "aws glue get-job-run --job-name '${{ vars.GLUE_JOB_SILVER }}' --run-id '$RUN_ID' --query 'JobRun.JobRunState' --output text")
            echo "Current Status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Silver Glue Job completed successfully!"
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Silver Glue Job failed with state: $STATUS"
              exit 1
            fi
            sleep 30
          done

      # 12. Start Glue Job Silver→Gold
      # 13. Wait until Success
      - name: Start Glue Job Silver→Gold and Wait
        run: |
          # Helper function to run AWS CLI commands with retry and credential expiration handling
          run_aws_cli() {
            local cmd="$1"
            local attempt=1
            local max_attempts=3
            local output
            local exit_code
            
            while [ $attempt -le $max_attempts ]; do
              local err_file=$(mktemp)
              output=$(eval "$cmd" 2>"$err_file")
              exit_code=$?
              local err_msg=$(cat "$err_file")
              rm -f "$err_file"
              
              if [ $exit_code -eq 0 ]; then
                echo "$output"
                return 0
              fi
              
              if echo "$err_msg" | grep -Eiq "AccessDenied|ExpiredToken|voc-cancel-cred"; then
                echo "Federated AWS credentials expired. Update GitHub Secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN) and rerun the workflow."
                exit 1
              fi
              
              echo "Warning: AWS CLI call failed (Attempt $attempt/$max_attempts). Error: $err_msg" >&2
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                sleep 5
              fi
            done
            
            echo "Error: AWS CLI call failed after $max_attempts attempts." >&2
            exit 1
          }

          echo "Starting Glue Job Silver->Gold: ${{ vars.GLUE_JOB_GOLD }}..."
          RUN_ID=$(run_aws_cli "aws glue start-job-run --job-name '${{ vars.GLUE_JOB_GOLD }}' --query 'JobRunId' --output text")
          echo "Job Run ID: $RUN_ID"
          
          echo "Polling Gold Job status..."
          while true; do
            STATUS=$(run_aws_cli "aws glue get-job-run --job-name '${{ vars.GLUE_JOB_GOLD }}' --run-id '$RUN_ID' --query 'JobRun.JobRunState' --output text")
            echo "Current Status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Gold Glue Job completed successfully!"
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Gold Glue Job failed with state: $STATUS"
              exit 1
            fi
            sleep 30
          done

      # 14. Start Glue Crawler
      # 15. Wait until Success
      - name: Start Glue Crawler and Wait
        run: |
          # Helper function to run AWS CLI commands with retry and credential expiration handling
          run_aws_cli() {
            local cmd="$1"
            local attempt=1
            local max_attempts=3
            local output
            local exit_code
            
            while [ $attempt -le $max_attempts ]; do
              local err_file=$(mktemp)
              output=$(eval "$cmd" 2>"$err_file")
              exit_code=$?
              local err_msg=$(cat "$err_file")
              rm -f "$err_file"
              
              if [ $exit_code -eq 0 ]; then
                echo "$output"
                return 0
              fi
              
              if echo "$err_msg" | grep -Eiq "AccessDenied|ExpiredToken|voc-cancel-cred"; then
                echo "Federated AWS credentials expired. Update GitHub Secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN) and rerun the workflow."
                exit 1
              fi
              
              echo "Warning: AWS CLI call failed (Attempt $attempt/$max_attempts). Error: $err_msg" >&2
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                sleep 5
              fi
            done
            
            echo "Error: AWS CLI call failed after $max_attempts attempts." >&2
            exit 1
          }

          echo "Starting Glue Crawler: ${{ vars.GLUE_CRAWLER }}..."
          STATE=$(run_aws_cli "aws glue get-crawler --name '${{ vars.GLUE_CRAWLER }}' --query 'Crawler.State' --output text")
          if [ "$STATE" = "READY" ]; then
            run_aws_cli "aws glue start-crawler --name '${{ vars.GLUE_CRAWLER }}'"
            echo "Waiting for crawler to transition to RUNNING..."
            for i in {1..12}; do
              STATE=$(run_aws_cli "aws glue get-crawler --name '${{ vars.GLUE_CRAWLER }}' --query 'Crawler.State' --output text")
              echo "Current Crawler State: $STATE"
              if [ "$STATE" != "READY" ]; then
                break
              fi
              sleep 5
            done
          else
            echo "Crawler is already running (State: $STATE)."
          fi
          
          echo "Polling Glue Crawler until READY..."
          while true; do
            STATE=$(run_aws_cli "aws glue get-crawler --name '${{ vars.GLUE_CRAWLER }}' --query 'Crawler.State' --output text")
            echo "Current Crawler State: $STATE"
            if [ "$STATE" = "READY" ]; then
              echo "Glue Crawler execution completed!"
              break
            fi
            sleep 30
          done

          # Check crawler execution result
          CRAWLER_STATUS=$(run_aws_cli "aws glue get-crawler --name '${{ vars.GLUE_CRAWLER }}' --query 'Crawler.LastCrawl.Status' --output text")
          echo "Crawler Last Crawl Status: $CRAWLER_STATUS"
          if [ "$CRAWLER_STATUS" = "FAILED" ]; then
            echo "Glue Crawler execution failed!"
            exit 1
          elif [ "$CRAWLER_STATUS" = "CANCELLED" ]; then
            echo "Glue Crawler execution was cancelled!"
            exit 1
          fi

      # 16. Print Deployment Completed
      - name: Print Deployment Completed
        run: |
          echo "Deployment Successful! All ETL Glue Jobs and Crawler completed successfully."
