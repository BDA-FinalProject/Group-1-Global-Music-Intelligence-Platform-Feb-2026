name: Deploy Glue CI/CD

on:
  push:
    branches:
      - feature/glue-cicd-terraform
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy and Run ETL Pipeline
    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_script_bucket_name: ${{ vars.S3_BUCKET_NAME }}
      TF_VAR_glue_job_silver_name: ${{ vars.GLUE_JOB_SILVER }}
      TF_VAR_glue_job_gold_name: ${{ vars.GLUE_JOB_GOLD }}
      TF_VAR_glue_crawler_name: ${{ vars.GLUE_CRAWLER }}
      TF_VAR_glue_database_name: ${{ vars.DATABASE_GLUE }}
      TF_VAR_glue_role_name: ${{ vars.GLUE_ROLE_NAME }}

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Check AWS Resource Existence to set variables for Terraform conditional logic
      - name: Check AWS Resource Existence
        id: check-resources
        run: |
          echo "Checking S3 Bucket..."
          if aws s3api head-bucket --bucket "${{ vars.S3_BUCKET_NAME }}" >/dev/null 2>&1; then
            echo "TF_VAR_create_s3_bucket=false" >> $GITHUB_ENV
            echo "S3 Bucket exists."
          else
            echo "TF_VAR_create_s3_bucket=true" >> $GITHUB_ENV
            echo "S3 Bucket does not exist."
          fi

          echo "Checking Glue Database..."
          if aws glue get-database --name "${{ vars.DATABASE_GLUE }}" >/dev/null 2>&1; then
            echo "TF_VAR_create_glue_database=false" >> $GITHUB_ENV
            echo "Glue Database exists."
          else
            echo "TF_VAR_create_glue_database=true" >> $GITHUB_ENV
            echo "Glue Database does not exist."
          fi

          echo "Checking Silver Glue Job..."
          if aws glue get-job --job-name "${{ vars.GLUE_JOB_SILVER }}" >/dev/null 2>&1; then
            echo "TF_VAR_create_glue_job_silver=false" >> $GITHUB_ENV
            echo "Silver Glue Job exists."
          else
            echo "TF_VAR_create_glue_job_silver=true" >> $GITHUB_ENV
            echo "Silver Glue Job does not exist."
          fi

          echo "Checking Gold Glue Job..."
          if aws glue get-job --job-name "${{ vars.GLUE_JOB_GOLD }}" >/dev/null 2>&1; then
            echo "TF_VAR_create_glue_job_gold=false" >> $GITHUB_ENV
            echo "Gold Glue Job exists."
          else
            echo "TF_VAR_create_glue_job_gold=true" >> $GITHUB_ENV
            echo "Gold Glue Job does not exist."
          fi

          echo "Checking Glue Crawler..."
          if aws glue get-crawler --name "${{ vars.GLUE_CRAWLER }}" >/dev/null 2>&1; then
            echo "TF_VAR_create_glue_crawler=false" >> $GITHUB_ENV
            echo "Glue Crawler exists."
          else
            echo "TF_VAR_create_glue_crawler=true" >> $GITHUB_ENV
            echo "Glue Crawler does not exist."
          fi

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.5.7' }}

      # 4. terraform fmt
      - name: Terraform Format
        run: terraform fmt -check
        working-directory: terraform

      # 5. terraform init
      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      # 6. terraform validate
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      # 7. terraform plan
      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform

      # 8. terraform apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform

      # 9. Upload ETL Scripts
      - name: Upload ETL Scripts to S3
        run: |
          echo "Uploading ETL Scripts to S3 Bucket: ${{ vars.S3_BUCKET_NAME }}..."
          aws s3 cp etl/final_silver_etl.py s3://${{ vars.S3_BUCKET_NAME }}/etl/final_silver_etl.py
          aws s3 cp etl/gold_etl.py s3://${{ vars.S3_BUCKET_NAME }}/etl/gold_etl.py

      # Update Glue Job script locations
      - name: Update Glue Job Script Locations
        run: |
          echo "Ensuring Silver Glue Job script path is updated..."
          aws glue update-job --job-name "${{ vars.GLUE_JOB_SILVER }}" --job-update "Role=$(aws glue get-job --job-name \"${{ vars.GLUE_JOB_SILVER }}\" --query 'Job.Role' --output text),Command={Name=glueetl,ScriptLocation=s3://${{ vars.S3_BUCKET_NAME }}/etl/final_silver_etl.py,PythonVersion=3}"
          
          echo "Ensuring Gold Glue Job script path is updated..."
          aws glue update-job --job-name "${{ vars.GLUE_JOB_GOLD }}" --job-update "Role=$(aws glue get-job --job-name \"${{ vars.GLUE_JOB_GOLD }}\" --query 'Job.Role' --output text),Command={Name=glueetl,ScriptLocation=s3://${{ vars.S3_BUCKET_NAME }}/etl/gold_etl.py,PythonVersion=3}"

      # 10. Start Glue Job Bronze→Silver
      # 11. Wait until Success
      - name: Start Glue Job Bronze→Silver and Wait
        run: |
          echo "Starting Glue Job Bronze->Silver: ${{ vars.GLUE_JOB_SILVER }}..."
          RUN_ID=$(aws glue start-job-run --job-name "${{ vars.GLUE_JOB_SILVER }}" --query 'JobRunId' --output text)
          echo "Job Run ID: $RUN_ID"
          
          echo "Polling Silver Job status..."
          while true; do
            STATUS=$(aws glue get-job-run --job-name "${{ vars.GLUE_JOB_SILVER }}" --run-id "$RUN_ID" --query 'JobRun.JobRunState' --output text)
            echo "Current Status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Silver Glue Job completed successfully!"
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Silver Glue Job failed with state: $STATUS"
              exit 1
            fi
            sleep 30
          done

      # 12. Start Glue Job Silver→Gold
      # 13. Wait until Success
      - name: Start Glue Job Silver→Gold and Wait
        run: |
          echo "Starting Glue Job Silver->Gold: ${{ vars.GLUE_JOB_GOLD }}..."
          RUN_ID=$(aws glue start-job-run --job-name "${{ vars.GLUE_JOB_GOLD }}" --query 'JobRunId' --output text)
          echo "Job Run ID: $RUN_ID"
          
          echo "Polling Gold Job status..."
          while true; do
            STATUS=$(aws glue get-job-run --job-name "${{ vars.GLUE_JOB_GOLD }}" --run-id "$RUN_ID" --query 'JobRun.JobRunState' --output text)
            echo "Current Status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Gold Glue Job completed successfully!"
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Gold Glue Job failed with state: $STATUS"
              exit 1
            fi
            sleep 30
          done

      # 14. Start Glue Crawler
      # 15. Wait until Success
      - name: Start Glue Crawler and Wait
        run: |
          echo "Starting Glue Crawler: ${{ vars.GLUE_CRAWLER }}..."
          STATE=$(aws glue get-crawler --name "${{ vars.GLUE_CRAWLER }}" --query 'Crawler.State' --output text)
          if [ "$STATE" = "READY" ]; then
            aws glue start-crawler --name "${{ vars.GLUE_CRAWLER }}"
            echo "Waiting for crawler to transition to RUNNING..."
            for i in {1..12}; do
              STATE=$(aws glue get-crawler --name "${{ vars.GLUE_CRAWLER }}" --query 'Crawler.State' --output text)
              echo "Current Crawler State: $STATE"
              if [ "$STATE" != "READY" ]; then
                break
              fi
              sleep 5
            done
          else
            echo "Crawler is already running (State: $STATE)."
          fi
          
          echo "Polling Glue Crawler until READY..."
          while true; do
            STATE=$(aws glue get-crawler --name "${{ vars.GLUE_CRAWLER }}" --query 'Crawler.State' --output text)
            echo "Current Crawler State: $STATE"
            if [ "$STATE" = "READY" ]; then
              echo "Glue Crawler execution completed!"
              break
            fi
            sleep 30
          done

          # Check crawler execution result
          CRAWLER_STATUS=$(aws glue get-crawler --name "${{ vars.GLUE_CRAWLER }}" --query 'Crawler.LastCrawl.Status' --output text)
          echo "Crawler Last Crawl Status: $CRAWLER_STATUS"
          if [ "$CRAWLER_STATUS" = "FAILED" ]; then
            echo "Glue Crawler execution failed!"
            exit 1
          elif [ "$CRAWLER_STATUS" = "CANCELLED" ]; then
            echo "Glue Crawler execution was cancelled!"
            exit 1
          fi

      # 16. Print Deployment Completed
      - name: Print Deployment Completed
        run: |
          echo "Deployment Successful! All ETL Glue Jobs and Crawler completed successfully."
