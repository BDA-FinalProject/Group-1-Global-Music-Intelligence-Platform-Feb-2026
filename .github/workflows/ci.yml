name: CI Validate Pipeline

on:
  push:
    branches:
      - feature/glue-cicd-terraform
      - dev
  pull_request:
    branches:
      - feature/glue-cicd-terraform
      - dev

jobs:
  ci-validate:
    name: Continuous Integration Validation
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.12
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install requirements.txt (if exists)
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            if [ -s requirements.txt ]; then
              pip install -r requirements.txt
            else
              echo "requirements.txt is empty. Skipping installation."
            fi
          else
            echo "requirements.txt does not exist. Skipping."
          fi

      # 5. Install Ruff
      - name: Install Ruff
        run: pip install ruff

      # 6. Run python -m compileall etl/
      - name: Compile All ETL Scripts
        run: python -m compileall etl/

      # 7. Verify every ETL file can be compiled individually
      - name: Compile ETL Files Individually
        run: |
          echo "Compiling each file in etl/ individually..."
          for file in etl/*.py; do
            if [ -f "$file" ]; then
              echo "Compiling $file..."
              python -m py_compile "$file"
            fi
          done

      # 8. Run ruff check .
      - name: Run Ruff Linter
        run: ruff check .

      # 9. Verify required folders exist
      - name: Verify Required Directories
        run: |
          for dir in etl terraform ingestion .github; do
            if [ -d "$dir" ]; then
              echo "✓ Directory '$dir' exists."
            else
              echo "✗ Error: Directory '$dir' is missing!"
              exit 1
            fi
          done

      # 10. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      # 11. terraform fmt -check
      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: terraform

      # 12. terraform init
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform

      # 13. terraform validate
      # 14. Fail if validation fails
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      # 15. Display CI Passed Successfully
      - name: Display Success Message
        run: echo "CI Passed Successfully"

      # Optional Test Stage: Run pytest if tests/ exists
      - name: Run pytest (if tests/ exists)
        run: |
          if [ -d "tests" ]; then
            echo "Running pytest..."
            pip install pytest
            pytest
          else
            echo "No 'tests/' directory found. Skipping test stage."
          fi
